---\nname: "Phase"\ndescription: "Define a delivery phase for AetherNotes (0–8) with scope, gates, and handoff requirements."\ntitle: "Phase NN: <short title>"\nlabels: ["phase"]\nassignees: []\nbody:\n  - type: markdown\n    attributes:\n      value: |\n        Use this for Phases 00–08. This form is the contract for scope and acceptance gates.\n        Required outputs per phase: code + tests + Docs/Handoff/PhaseNN.md + update Docs/STATE.md + ADR if architecture changes.\n\n  - type: dropdown\n    id: phase_number\n    attributes:\n      label: Phase number\n      options:\n        - "00 Bootstrap"\n        - "01 Data Architecture & Sync"\n        - "02 Cryptography & Security Core"\n        - "03 Machine Learning & Audio Pipeline"\n        - "04 Shared Business Logic & Vibe Coding Rules"\n        - "05 macOS Client"\n        - "06 iOS Client"\n        - "07 iPadOS Client"\n        - "08 watchOS Client"\n    validations:\n      required: true\n\n  - type: dropdown\n    id: area\n    attributes:\n      label: Primary area\n      options:\n        - "Repo/Tooling"\n        - "Data (SwiftData)"\n        - "Sync (CloudKit / CKSyncEngine)"\n        - "Security (Secure Enclave / Keychain)"\n        - "Audio (AVFoundation)"\n        - "Transcription (WhisperKit / Core ML)"\n        - "UI (SwiftUI)"\n        - "watchOS / WatchConnectivity"\n        - "Widgets / ActivityKit"\n        - "CI / QA"\n    validations:\n      required: true\n\n  - type: textarea\n    id: scope\n    attributes:\n      label: Scope (what will be built)\n      description: "Clear, testable statements. Avoid vague goals."\n      placeholder: |\n        Example:\n        - Implement CKSyncEngine wrapper with state persistence and retry policy\n        - Add SwiftData model types: Note, AudioItem, Transcript, TranscriptSegment\n        - Add mapping layer from models to CKRecord/CKAsset\n    validations:\n      required: true\n\n  - type: textarea\n    id: deliverables\n    attributes:\n      label: Concrete deliverables\n      description: "List the artifacts that must exist at the end of the phase."\n      placeholder: |\n        - Packages/AetherNotesSync implemented with CKSyncEngine wrapper\n        - Docs/Specs/cloudkit_schema.md updated\n        - Unit tests for merge determinism and chunking\n        - Docs/Handoff/PhaseNN.md completed\n    validations:\n      required: true\n\n  - type: checkboxes\n    id: acceptance_gates\n    attributes:\n      label: Acceptance gates (must be true to close the phase)\n      options:\n        - label: "Builds all targets (iOS, iPadOS, macOS, watchOS, Widgets) or explicitly not applicable yet"\n          required: true\n        - label: "Unit tests added for new critical logic"\n          required: true\n        - label: "Docs/Handoff/PhaseNN.md written"\n          required: true\n        - label: "Docs/STATE.md updated"\n          required: true\n        - label: "ADR added if architecture or storage format changed"\n          required: true\n        - label: "No plaintext secrets introduced"\n          required: true\n\n  - type: textarea\n    id: test_plan\n    attributes:\n      label: Test plan\n      description: "How will we verify it works. Include commands where possible."\n      placeholder: |\n        - swift test (packages)\n        - xcodebuild -scheme ...\n        - Manual smoke test: record 2 min, stop, replay, verify transcript segments\n    validations:\n      required: true\n\n  - type: checkboxes\n    id: entitlements\n    attributes:\n      label: Entitlements and capabilities (check any expected changes)\n      options:\n        - label: "iCloud / CloudKit"\n        - label: "Background audio"\n        - label: "Microphone"\n        - label: "Speech recognition (only if using Apple Speech fallback)"\n        - label: "App Groups (widgets / extensions)"\n        - label: "Keychain access / Secure Enclave usage"\n        - label: "Push notifications (CloudKit sync notifications)"\n        - label: "WatchConnectivity"\n    validations:\n      required: false\n\n  - type: textarea\n    id: risks\n    attributes:\n      label: Risks and mitigations\n      placeholder: |\n        - Risk: CloudKit token expiry causes full resync. Mitigation: handle CKError.changeTokenExpired path.\n        - Risk: memory spikes in WhisperKit. Mitigation: prewarm and reuse buffers.\n    validations:\n      required: true\n\n  - type: textarea\n    id: out_of_scope\n    attributes:\n      label: Out of scope (explicitly not doing)\n      placeholder: |\n        - No UI polish beyond basic screens\n        - No full-text search indexing in this phase\n    validations:\n      required: false\n\n  - type: textarea\n    id: dependencies\n    attributes:\n      label: Dependencies / prerequisites\n      placeholder: |\n        - Requires Phase 00 merged\n        - Requires iCloud container ID configured\n    validations:\n      required: false\n