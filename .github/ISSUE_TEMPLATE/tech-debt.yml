name: "Tech debt"
description: "Track refactors, cleanup, and architecture improvements."
title: "TechDebt: <short title>"
labels: ["tech-debt"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is the debt and where does it live."
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "Why it matters. Risk, maintenance cost, performance, correctness."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Must fix before beta"
        - "P1: Should fix soon"
        - "P2: Nice to have"
        - "P3: Park it"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      placeholder: |
        - Option A:
        - Option B:
        - Recommendation:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Builds all targets
        - Adds/updates tests
        - No public API break (or documented migration)
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: "Links to PRs, commits, ADRs, files."
    validations:
      required: false
