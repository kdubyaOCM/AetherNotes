name: Secret Scan

on:
  pull_request:
  push:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run secret scanner
        run: python3 .github/scripts/secret_scan.py --mode ci
